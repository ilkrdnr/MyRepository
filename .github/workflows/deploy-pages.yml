name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish Blazor app
        run: |
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            dotnet publish FrpHelper.Web/FrpHelper.Web.csproj -c Release -o publish /p:StaticWebAssetBasePath=/
          else
            dotnet publish FrpHelper.Web/FrpHelper.Web.csproj -c Release -o publish /p:StaticWebAssetBasePath=${{ github.event.repository.name }}
          fi

      - name: Configure base path for Pages
        run: |
          INDEX_FILE="publish/wwwroot/index.html"

          if [ ! -f "${INDEX_FILE}" ]; then
            echo "index.html bulunamadi: ${INDEX_FILE}"
            find publish -maxdepth 4 -type f
            exit 1
          fi

          if [ -z "${CUSTOM_DOMAIN}" ]; then
            python3 -c "from pathlib import Path; import os; p = Path('publish/wwwroot/index.html'); t = p.read_text(encoding='utf-8'); r = os.environ['GITHUB_REPOSITORY'].split('/', 1)[1]; p.write_text(t.replace('<base href=\"/\" />', f'<base href=\"/{r}/\" />'), encoding='utf-8')"
          else
            echo "${CUSTOM_DOMAIN}" > publish/wwwroot/CNAME
          fi

          cp "${INDEX_FILE}" publish/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
